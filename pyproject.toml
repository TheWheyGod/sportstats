[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportvalue"
version = "0.1.0"
description = "Detection de value sur books ARJEL : football, rugby, basket, tennis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.scripts]
sportvalue = "sportvalue.cli:main"

[tool.setuptools.packages.find]
include = ["sportvalue*"]
