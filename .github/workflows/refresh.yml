# Rafraichissement automatique de la page, sans PC ni Claude dans la boucle.
#
# Deux jobs, deux cadences, un seul budget d'API a respecter :
#   - "journee" : chaque matin, calendrier 48 h + modeles + absences.
#                 1 credit The Odds API (NRL) + 4 requetes API-Football.
#   - "live"    : toutes les 30 minutes en journee, scores des matchs en
#                 cours. Football : 2 requetes API-Football, 0 credit Odds API.
#                 Rugby (NRL) : 1 credit Odds API par passage avec match en cours.
#
# Les heures du cron sont en UTC (GitHub ne connait pas Europe/Paris) :
# 05:30 UTC = 07:30 a Paris en ete, 06:30 en hiver. Decalage d'une heure au
# changement d'heure, sans consequence. En revanche le code, lui, tourne en
# heure de Paris (TZ ci-dessous) : les dates "aujourd'hui / demain" et
# l'horodatage "genere le" sont les memes que sur le PC.
#
# GitHub ne garantit pas l'heure d'un cron : retards de deux heures observes,
# et parfois pas de run du tout. D'ou le cron de secours de 07:15 UTC, et
# surtout la regle dans refresh.py : tout passage "live" qui trouve une
# journee datee d'hier refait le cycle complet a sa place.
#
# La page produite est commitee dans docs/ et servie par GitHub Pages.
name: refresh

on:
  schedule:
    - cron: "30 5 * * *"          # journee complete, 07:30 Paris (ete)
    - cron: "15 7 * * *"           # secours : refait la journee si celle du matin a saute
    - cron: "5,35 9-22 * * *"      # live, toutes les 30 min de 11h a 00h35 Paris (ete)
  workflow_dispatch:
    inputs:
      mode:
        description: "complet ou live"
        default: "complet"

env:
  TZ: Europe/Paris

# Un seul run a la fois : le job live ne doit pas ecrire pendant que la
# journee du matin regenere tout.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Mode et date
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * *" ]; then
            echo "mode=complet" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
          fi
          echo "jour=$(date +%F)" >> "$GITHUB_OUTPUT"

      # Les CSV de resultats (football-data, Wikipedia, NRL) sont gratuits
      # mais volumineux (~100 Mo) : on les garde d'un jour a l'autre pour ne
      # pas tout retelecharger. Cle par jour : un seul enregistrement
      # quotidien, les runs "live" de la journee ne font que le relire.
      - name: Cache des donnees
        uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ steps.ctx.outputs.jour }}
          restore-keys: data-

      # La journee calculee le matin doit etre retrouvee par les runs "live"
      # de la journee. Elle est trop lourde pour git : elle transite par le
      # cache, sauvegardee sous une cle unique a chaque run et restauree par
      # prefixe (donc toujours la plus recente).
      - name: Restaurer la journee
        uses: actions/cache/restore@v4
        with:
          path: |
            journee.slate
            journee.date
          key: slate-${{ github.run_id }}
          restore-keys: slate-

      - name: Rafraichir
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
          PYTHONIOENCODING: utf-8
        run: python refresh.py ${{ steps.ctx.outputs.mode }}

      - name: Sauvegarder la journee
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            journee.slate
            journee.date
          key: slate-${{ github.run_id }}

      # La page est reposee sur l'etat COURANT de main : si un commit est
      # arrive pendant le run (une correction poussee depuis le PC), le push
      # reste en avance rapide au lieu d'echouer.
      - name: Publier
        run: |
          git config user.name "sportvalue-bot"
          git config user.email "bot@users.noreply.github.com"
          cp docs/index.html /tmp/index.html
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/index.html docs/index.html
          git add docs/index.html
          # Rien a commiter = rien n'a change (typiquement : aucun match en cours).
          git diff --cached --quiet && echo "page inchangee" && exit 0
          git commit -m "refresh: ${{ steps.ctx.outputs.mode }} $(date +'%Y-%m-%d %H:%M Paris')"
          git push origin HEAD:main
